version: 2

models:
  - name: stg_grocery_orders
    columns:
      - name: order_id
        tests:
          - not_null
          - unique

      - name: order_date
        tests:
          - not_null

      - name: customer_id
        tests:
          - not_null

      - name: customer_name
        tests:
          - not_null

      - name: category
        tests:
          - not_null

      - name: quantity
        tests:
          - not_null

      - name: unit_price
        tests:
          - not_null

      - name: discount
        tests:
          - not_null

      - name: net_sales
        tests:
          - not_null

      - name: delivery_status
        tests:
          - not_null